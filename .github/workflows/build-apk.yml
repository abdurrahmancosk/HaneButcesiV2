name: Hane Butcesi v2 - Android APK & Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Android lisanslari
        run: yes | flutter doctor --android-licenses || true

      - name: Python paketleri
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: APK derle
        run: |
          flet build apk -vv --yes \
            --project "hanebutcesi2" \
            --product "Hane Bütçesi" \
            --org "com.evbutcesi" \
            --splash-color "#0f172a" --splash-dark-color "#0f172a" \
            --android-permissions android.permission.INTERNET=true android.permission.CAMERA=true android.permission.RECORD_AUDIO=true android.permission.POST_NOTIFICATIONS=true

      - name: APK dosyasini hazirla
        run: |
          mkdir -p release_dist
          find build/apk -name "*.apk" -exec cp {} release_dist/HaneButcesi_v2.apk \;

      - name: Artifact yukle
        uses: actions/upload-artifact@v4
        with:
          name: HaneButcesi-v2-APK
          path: release_dist/HaneButcesi_v2.apk

      - name: Release yayinla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Hane Bütçesi v2 - En Güncel Sürüm"
          body: |
            GitHub tarafından otomatik derlendi.
            HaneButcesi_v2.apk dosyasını iki telefona da indirip kurun.
          files: release_dist/HaneButcesi_v2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python paketleri
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller cryptography
          $v = python -c "import flet; print(getattr(flet, '__version__', '') or __import__('flet.version', fromlist=['x']).version)"
          Write-Host "flet surumu: $v"
          pip install "flet-desktop==$v"
          if ($LASTEXITCODE -ne 0) { pip install flet-desktop }
          python -c "import flet_desktop; print('flet_desktop OK')"

      - name: EXE derle
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "HaneButcesi" --collect-all flet --collect-all flet_desktop --collect-all certifi --hidden-import websockets --hidden-import flet_desktop --hidden-import openpyxl --hidden-import pypdf --hidden-import cryptography --add-data "assets;assets" --icon "assets/icon.ico" main.py

      - name: Artifact yukle
        uses: actions/upload-artifact@v4
        with:
          name: HaneButcesi-v2-EXE
          path: dist/HaneButcesi.exe

      - name: Release'e ekle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: dist/HaneButcesi.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
